# Security headers, included by every location block.
#
# nginx does not merge `add_header` across levels: as soon as one location
# declares an `add_header`, the server-level headers are dropped for that
# location. Since /index.html and /assets/ both set Cache-Control, the headers
# have to be re-included there or the SPA would ship with no CSP at all.

# The SPA loads only its own bundle, talks only to its own origin, and must
# never be framed (the TV view is an attractive clickjacking target).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Enable once TLS terminates in front of this container:
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
