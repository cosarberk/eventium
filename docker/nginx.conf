resolver 127.0.0.11 valid=30s;

# Pass a correct Connection header for WebSocket upgrades and keep-alive for
# everything else. A hardcoded `Connection: upgrade` on plain requests breaks
# connection reuse and confuses intermediate proxies.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    # 8080, not 80: the container runs unprivileged and cannot bind a low port.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the exact server version.
    server_tokens off;

    # Cap request bodies; the API rejects oversized payloads too, but stopping
    # them at the edge avoids buffering them at all.
    client_max_body_size 2m;

    # ── Security headers ─────────────────────────────────────────────
    # Declared once in security-headers.conf and re-included per location:
    # nginx drops inherited add_header directives in any location that declares
    # one of its own.
    include /etc/nginx/security-headers.conf;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Cache static assets (content-hashed by Vite).
    # `expires` is deliberately not used alongside this: it emits a second
    # Cache-Control header, leaving two conflicting values on every response.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Never cache the shell, so a deploy is picked up immediately.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Container-level liveness probe that does not reach the backend.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend
    location /api/ {
        set $backend_upstream http://backend:4000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Proxy GraphQL requests
    location /graphql {
        set $backend_upstream http://backend:4000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Proxy WebSocket connections
    location /socket.io/ {
        set $backend_upstream http://backend:4000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long-lived connections must not be cut by the default read timeout.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
