# Tek uygulama: backend + frontend aynı container'da (docker/Dockerfile).
# Port 8080'de nginx statik SPA'yı servis eder ve API'yi 127.0.0.1:4000'e proxy'ler.
apiVersion: v1
kind: Service
metadata:
  name: eventium
  namespace: eventium
spec:
  selector:
    app: eventium
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventium
  namespace: eventium
spec:
  # 1 replica: container başlangıçta `prisma migrate deploy` çalıştırıyor;
  # çok replika aynı anda migrate ederse yarışır. Ölçeklemeden önce migration'ı
  # ayrı bir Job'a al ve RUN_MIGRATIONS=false yap.
  replicas: 1
  selector:
    matchLabels:
      app: eventium
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: eventium
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: eventium
          # kustomization.yaml içindeki `images:` bloğu registry+tag'i override eder.
          image: eventium
          ports:
            - name: http
              containerPort: 8080
            # Backend; Service'e dahil değil, sadece probe'lar için container-içi.
            - name: api
              containerPort: 4000
          envFrom:
            - configMapRef:
                name: eventium-config
            - secretRef:
                name: eventium-secrets
          # Migration + iki process başlaması gecikebilir; startupProbe backend
          # ayağa kalkana dek liveness/readiness'i beklemede tutar.
          startupProbe:
            httpGet:
              path: /health/live
              port: 4000
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            # nginx ayakta mı (backend ölürse launcher nginx'i de kapatır → restart).
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            # Backend + DB + Redis sağlığı (doğrudan 4000, nginx'i atlar).
            httpGet:
              path: /health
              port: 4000
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "150m"
              memory: "320Mi"
            limits:
              memory: "640Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
