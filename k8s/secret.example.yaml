# Gerçek secret'ları BURAYA yazma ve bu dosyayı commit'leme.
# Kopyala:  cp secret.example.yaml secret.yaml   ve secret.yaml'ı doldur.
# secret.yaml .gitignore ile hariç tutuluyor.
#
# Değer üretimi:
#   openssl rand -base64 48   -> JWT_SECRET ve ENCRYPTION_KEY için
#
# DATABASE_URL içindeki parola POSTGRES_PASSWORD ile aynı olmalı (postgres.yaml
# bu secret'tan POSTGRES_PASSWORD'ü okuyor).
apiVersion: v1
kind: Secret
metadata:
  name: eventium-secrets
  namespace: eventium
type: Opaque
stringData:
  POSTGRES_PASSWORD: "CHANGE_ME_strong_password"
  JWT_SECRET: "CHANGE_ME_openssl_rand_base64_48"
  ENCRYPTION_KEY: "CHANGE_ME_openssl_rand_base64_48"
  # Host = postgres servisi (aşağıdaki postgres.yaml Service adı). Paroayı yukarıdakiyle eşle.
  DATABASE_URL: "postgresql://eventium:CHANGE_ME_strong_password@postgres:5432/eventium"
