apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# NOT: secret.yaml burada listelenmez (gerçek secret git'e girmesin diye).
# Önce `cp secret.example.yaml secret.yaml`, doldur, sonra ayrıca uygula:
#   kubectl apply -f k8s/secret.yaml
resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml
  - redis.yaml
  - eventium.yaml
  - ingress.yaml

# Registry + tag'i TEK YERDEN burada değiştir.
images:
  - name: eventium
    newName: docker.io/cosarberk/eventium
    newTag: latest
