# Tüm trafik frontend'e gider; frontend Nginx'i /api, /graphql, /socket.io'yu
# backend'e proxy'liyor, bu yüzden ayrı bir backend ingress'i gerekmez.
#
# NOT: ingressClassName ve annotation'lar ingress controller'ına göre değişir
# (aşağıdakiler ingress-nginx içindir). Domain'ini host alanına yaz.
# TLS için cert-manager kullanıyorsan tls bloğunu ve annotation'ı aç.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eventium
  namespace: eventium
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # WebSocket (socket.io) için:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  rules:
    - host: eventium.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
  # tls:
  #   - hosts:
  #       - eventium.example.com
  #     secretName: eventium-tls
