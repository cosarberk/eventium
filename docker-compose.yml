# Eventium — full stack.
#
# Required in .env before `docker compose up`:
#   JWT_SECRET       openssl rand -base64 48
#   ENCRYPTION_KEY   openssl rand -base64 48
#   POSTGRES_PASSWORD
# The compose file refuses to start without them rather than falling back to a
# shipped default, which every install would otherwise share.
#
# Host port bindings are limited to 127.0.0.1 for everything except the web
# frontend, so a single `docker compose up` on a public server does not also
# publish Postgres, Redis, and the raw API to the internet.

services:
  postgres:
    image: postgres:16-alpine
    container_name: eventium-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eventium}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-eventium}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eventium}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: eventium-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: eventium-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-eventium}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-eventium}
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      PORT: 4000
      # No defaults on purpose — see the header.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (openssl rand -base64 48)}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required (openssl rand -base64 48)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      # Same-origin by default: the frontend proxies to this service, so no
      # cross-origin request is made and no origin list is needed.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      # Behind the bundled Nginx, so X-Forwarded-* is trustworthy.
      TRUST_PROXY: ${TRUST_PROXY:-true}
      # Set to false if you terminate TLS elsewhere and serve plain HTTP; the
      # session cookie is not sent over HTTP while this is true.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      WEBHOOK_REQUIRE_SECRET: ${WEBHOOK_REQUIRE_SECRET:-true}
      EVENT_RETENTION_DAYS: ${EVENT_RETENTION_DAYS:-30}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Apply pending migrations on start; set false to manage them yourself.
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      # Create the first admin on an empty database (password printed in logs).
      RUN_SEED: ${RUN_SEED:-false}
      # Public base URL that GitLab/Nexus will call for webhooks.
      # Set it to your own domain in production, e.g. https://eventium.example.com
      # Leave empty only when using the opt-in `tunnel` profile below.
      PUBLIC_URL: ${PUBLIC_URL:-}
      TUNNEL_METRICS_URL: ${TUNNEL_METRICS_URL:-}
    ports:
      # Loopback only: reach the API through the frontend's /api and /graphql.
      - "127.0.0.1:${BACKEND_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        # Same-origin paths: the image is portable across hostnames.
        VITE_GRAPHQL_URL: ${VITE_GRAPHQL_URL:-/graphql}
        VITE_WS_URL: ${VITE_WS_URL:-}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: eventium-frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:8080"
    depends_on:
      backend:
        condition: service_started

  # Optional zero-config public tunnel so webhooks from GitLab/Nexus can reach
  # this instance from behind NAT. It is opt-in because it publishes the whole
  # app on a public *.trycloudflare.com URL for as long as it runs:
  #
  #   docker compose --profile tunnel up -d
  #
  # Then leave PUBLIC_URL empty and set TUNNEL_METRICS_URL=http://cloudflared:2000
  # so the backend can discover the generated hostname.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: eventium-cloudflared
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --url http://frontend:8080 --metrics 0.0.0.0:2000
    depends_on:
      - frontend

volumes:
  postgres_data:
  redis_data:
