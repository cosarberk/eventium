apiVersion: v1
kind: Secret
metadata:
  name: {{ include "eventium.fullname" . }}
  labels:
    {{- include "eventium.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ required "secrets.jwtSecret zorunlu (openssl rand -base64 48)" .Values.secrets.jwtSecret | quote }}
  ENCRYPTION_KEY: {{ required "secrets.encryptionKey zorunlu (openssl rand -base64 48)" .Values.secrets.encryptionKey | quote }}
  DATABASE_URL: {{ include "eventium.databaseUrl" . | quote }}
  {{- if .Values.postgres.enabled }}
  POSTGRES_PASSWORD: {{ required "postgres.password zorunlu" .Values.postgres.password | quote }}
  {{- end }}
