apiVersion: v1
kind: Service
metadata:
  name: {{ include "eventium.fullname" . }}
  labels:
    {{- include "eventium.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "eventium.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: app
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: 8080
